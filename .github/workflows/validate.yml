name: DigitScope Code Validation

on:
  push:
    branches:
      - feature/matches-intelligence-hybrid
  pull_request:
    branches:
      - feature/matches-intelligence-hybrid

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run JavaScript syntax checks
        run: npm run check

name: DigitScope build and tests

on:
  pull_request:
    branches:
      - feature/dataset-registry-provenance
  push:
    branches:
      - feature/instant-execution-backoffice

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

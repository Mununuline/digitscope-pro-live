<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070d18">
<meta name="description" content="DigitScope Pro real-time Deriv last-digit Matches and Differs analytics terminal.">
<title>DigitScope Pro | Instant Trading Front Desk</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<!-- Lucide CDN removed: avoid loading an ESM build as a classic script. Icons are optional. -->
<style>html{color-scheme:dark}body{margin:0;background:#070d18;font-family:Inter,system-ui,sans-serif}button,select,input{font:inherit}button:disabled{opacity:.45;cursor:not-allowed}.errorbox{margin-top:12px;padding:12px;border:1px solid #9a4c54;background:#351b25;color:#ffcbd0;border-radius:9px;font-size:11px}*{scrollbar-width:thin;scrollbar-color:#334155 #0b1422}</style>
</head>
<body>
<div id="root"><div style="padding:32px;color:#94a3b8">Loading DigitScope Pro terminal…</div></div>
<script>
(function(){
  function showError(message){
    var root=document.getElementById("root");
    if(!root)return;
    root.innerHTML='<div style="max-width:760px;margin:32px auto;padding:24px;color:#f8fafc;font:14px system-ui;background:#172033;border:1px solid #7f1d1d;border-radius:12px"><h2 style="font-size:20px;color:#fca5a5;margin:0 0 12px">DigitScope could not start</h2><p style="color:#cbd5e1">The page loaded, but its app script reported an error. Please send this diagnostic to support:</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;color:#fde68a">'+String(message).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})+'</pre><p style="color:#94a3b8">Refresh after the next deployment.</p></div>';
  }
  window.addEventListener("error",function(e){showError((e.message||"Script error")+" ("+(e.filename||"unknown file")+":"+(e.lineno||"?")+":"+(e.colno||"?")+")");});
  window.addEventListener("unhandledrejection",function(e){var r=e.reason;showError(r&&r.stack?r.stack:String(r||"Unhandled promise rejection"));});
  window.digitScopeShowError=showError;
})();
</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101d;color:#e8f1fa;font:14px/1.45 Inter,system-ui,sans-serif}.app{min-height:100vh}.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:13px max(14px,calc((100% - 1100px)/2));background:#0b1726;border-bottom:1px solid #203249}.top b{font-size:17px;letter-spacing:1px}.top small{display:block;color:#6bdde2;font-size:9px;letter-spacing:2px}.top a,.secondary{display:inline-block;background:#0a1725;border:1px solid #31566a;color:#9be9e5;border-radius:9px;padding:10px 13px;text-decoration:none;font-weight:800;font-size:10px}.app main{max-width:1100px;margin:auto;padding:20px 14px 48px}.card{background:#101d2d;border:1px solid #203249;border-radius:15px;padding:16px;margin-bottom:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.row small{color:#68dce2;font-size:9px;letter-spacing:2px;font-weight:800}.row h1{font-size:clamp(24px,5vw,36px);margin:3px 0}.row h2{margin:4px 0;font-size:19px}.good{color:#70e0b0}.warn{color:#f4bd73}.bad{color:#ff8790}.muted{color:#91a4b9;font-size:11px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}.grid label{font-size:10px;color:#91a4b9}.grid input,.grid select,.row select{display:block;width:100%;margin-top:5px;background:#091523;border:1px solid #2b4058;border-radius:8px;color:#e8f1fa;padding:11px;min-height:42px}.info{margin-top:14px;background:#091523;padding:11px;border-radius:9px;font-size:11px;color:#91a4b9}.target{color:#f5d36f!important;font-weight:900}.big{font-size:25px}.tape{display:flex;gap:5px;overflow:auto;padding:13px 0}.tape span{flex:0 0 29px;text-align:center;background:#091523;border:1px solid #203249;border-radius:7px;padding:8px 0;font-weight:800}.lanes{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card .quote{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:10px;margin:12px 0;padding:10px;background:#091523;border-radius:9px;color:#91a4b9;font-size:11px}.quote strong{font-size:16px;color:#e8f1fa}.primary{display:inline-block;border:0;border-radius:9px;background:#67ded0;color:#04151b;padding:13px 16px;font-weight:900;cursor:pointer;margin:5px 6px 0 0}.primary:disabled{opacity:.35;cursor:not-allowed}.armed{background:#f5c66d;color:#201606;border:0;border-radius:9px;padding:13px 16px;font-weight:900}.foot{text-align:center;color:#72869a;font-size:10px;margin:20px 0}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.lanes{grid-template-columns:1fr}.top{align-items:flex-start}.card{padding:12px}.row.info{align-items:flex-start}.card .quote{grid-template-columns:1fr auto}.app main{padding:12px 9px 35px}}
</style>
<script src="trade-desk.js?v=instant-v1"></script>
</body>
</html>
